<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}FillBot{% endblock %}</title>
  <meta name="description" content="{% block description %}Generate Google Forms instantly with AI. Describe your form and FillBot builds it.{% endblock %}">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/fillbot_no_borders.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <div class="background-layer"></div>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav floating-nav">
      <div class="container">
        <a class="navbar-brand mb-0 fs-5" href="{{ url_for('index') }}">FillBot</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link text-white" href="{{ url_for('index') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="{{ url_for('generate') }}">Create a form</a>
            </li>
          </ul>

          {% if user %}
            <a class="btn btn-outline-light rounded-4 ms-lg-auto" href="{{ url_for('logout') }}">Log out</a>
          {% else %}
            <a class="btn btn-outline-light rounded-4 ms-lg-auto" href="{{ url_for('login') }}">Log in</a>
          {% endif %}
        </div>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="py-4">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 text-start fw-light small">&copy; 2026 FillBot</div>
        <div class="col-md-6 text-end">
          <a href="https://github.com/ralphjacoby1-web/FIllbot_def" class="footer-link">Source on GitHub</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
