{% extends "layout.html" %}

{% block title %}{{ code }} | FillBot{% endblock %}

{% block content %}
<section class="min-vh-100 d-flex align-items-center text-center">
  <div class="container">
    <h1 class="display-1 fw-light text-white mb-3">{{ code }}</h1>
    <p class="text-secondary mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}">
      <button class="hero-action-btn">Back to FillBot</button>
    </a>
  </div>
</section>
{% endblock %}
